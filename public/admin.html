<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>إدارة أماكن اللجان</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<section id="loginView" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="off">
    <h1>إدارة أماكن اللجان</h1>
    <label for="pin">الرقم السري للإدارة</label>
    <input id="pin" type="password" autocomplete="current-password" required>
    <p id="loginErr" class="err" role="alert" hidden></p>
    <button type="submit" class="btn primary">دخول</button>
  </form>
</section>

<div id="editorView" class="editor" hidden>
  <header class="bar">
    <div>
      <h1>أماكن اللجان</h1>
      <p id="summary" class="summary" role="status"></p>
    </div>
    <div class="bar-actions">
      <span id="saveState" class="save-state" role="status"></span>
      <button id="saveBtn" type="button" class="btn primary small">حفظ</button>
      <button id="logoutBtn" type="button" class="btn ghost small">خروج</button>
    </div>
  </header>

  <div class="layout">
    <aside class="blocks" aria-label="البلوكات">
      <div id="blockList"></div>
      <button id="addBlock" type="button" class="btn outline">+ إضافة بلوك</button>
    </aside>

    <section class="grid-panel" aria-label="اللجان">
      <div class="grid-tools">
        <p id="selHint" class="sel-hint"></p>
        <form id="rangeForm" class="range-form" autocomplete="off">
          <label for="rangeIn" class="vh">أرقام اللجان</label>
          <input id="rangeIn" type="text" inputmode="numeric" placeholder="مثال: 1-12, 20, 25-30">
          <button type="submit" class="btn outline small">أضف للبلوك المحدد</button>
          <button id="clearBlock" type="button" class="btn ghost small">أفرغ البلوك</button>
        </form>
      </div>
      <div id="grid" class="grid"></div>
      <p class="legend">اضغط على رقم لجنة لإضافتها للبلوك المحدد، واضغط عليها مرة أخرى لإزالتها. اللجان بخط متقطع لم تُوزَّع بعد.</p>
    </section>
  </div>
</div>
<script src="/js/admin.js"></script>
</body>
</html>
